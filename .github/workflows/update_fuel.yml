name: Aggiorna distributori (MIMIT)
on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scarica anagrafica e prezzi
        run: python3 tools/update_fuel.py
      - name: Pubblica
        run: |
          git config user.name "goride-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fuel_it.json
          git diff --cached --quiet || (git commit -m "Aggiorna distributori e prezzi MIMIT" && git pull --rebase -q && git push)
