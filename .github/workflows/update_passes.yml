name: Aggiorna passi e valichi (OSM)
on:
  schedule:
    - cron: '41 3 * * 1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Strumenti
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
          pip install -q osmium
      - name: Scarica estratti Geofabrik e filtra
        run: |
          mkdir -p /tmp/osm && cd /tmp/osm
          for r in europe/italy europe/switzerland europe/austria europe/slovenia europe/liechtenstein europe/alps; do
            f=$(basename $r)
            curl -sSfL --retry 3 -o $f.pbf https://download.geofabrik.de/$r-latest.osm.pbf || { echo "salto $f"; continue; }
            osmium tags-filter -R -O -o $f-f.pbf $f.pbf n/mountain_pass=yes w/highway && rm $f.pbf
            ls -la $f-f.pbf
          done
      - name: Elenco passi
        run: |
          args=""
          for p in IT:italy CH:switzerland AT:austria SI:slovenia LI:liechtenstein :alps; do
            f=/tmp/osm/${p#*:}-f.pbf; [ -f $f ] && args="$args ${p%%:*}:$f"
          done
          python3 tools/update_passes.py $args
      - name: Pubblica
        run: |
          git config user.name "goride-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/passes.json
          git diff --cached --quiet || (git commit -m "Aggiorna passi e valichi" && git pull --rebase -q && git push)
