name: Aggiorna passi e valichi (OSM)
on:
  schedule:
    - cron: '41 3 * * 1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scarica passi
        run: python3 tools/update_passes.py
      - name: Pubblica
        run: |
          git config user.name "goride-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/passes.json
          git diff --cached --quiet || (git commit -m "Aggiorna passi e valichi" && git pull --rebase -q && git push)
