name: Aggiorna concessionarie Harley-Davidson (OSM)
on:
  schedule:
    - cron: '23 4 * * 2'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Scarica concessionarie
        run: python3 tools/update_hd.py
      - name: Pubblica
        run: |
          git config user.name "goride-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/hd.json
          git diff --cached --quiet || (git commit -m "Aggiorna concessionarie Harley-Davidson" && git pull --rebase -q && git push)
